<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 70 600 200" role="img" aria-labelledby="t">
  <title id="t">Navalha de barbear aberta</title>
  <defs>
    <linearGradient id="lamina" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9ced6"/>
      <stop offset=".45" stop-color="#f4f5f7"/>
      <stop offset="1" stop-color="#aeb4bd"/>
    </linearGradient>
    <linearGradient id="cabo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8925a"/>
      <stop offset="1" stop-color="#7d5f31"/>
    </linearGradient>
  </defs>
  <!-- lâmina: dorso reto em cima, fio curvo embaixo, espiga à esquerda do pino -->
  <path d="M300 150 Q296 118 326 112 L560 92 Q590 90 592 118 L590 168 Q544 198 330 180 Q302 176 300 150 Z"
        fill="url(#lamina)" stroke="#16304a" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M336 122 L572 102" stroke="#16304a" stroke-opacity=".35" stroke-width="1.5"/>
  <path d="M352 166 Q470 178 580 156" fill="none" stroke="#16304a" stroke-opacity=".25" stroke-width="1.2"/>
  <!-- espiga (o rabicho onde vai o dedo) -->
  <path d="M306 138 Q286 128 272 140 Q270 150 284 152 Q294 150 302 158" fill="url(#lamina)" stroke="#16304a" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- cabo -->
  <g transform="translate(316 152) rotate(160)">
    <rect x="-22" y="-17" width="300" height="34" rx="17" fill="url(#cabo)" stroke="#16304a" stroke-width="2.5"/>
    <path d="M10 -6 Q130 -12 260 -6" stroke="#fff" stroke-opacity=".25" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="256" cy="0" r="5" fill="#e9e3d6" stroke="#16304a" stroke-width="1.8"/>
  </g>
  <!-- pino -->
  <circle cx="316" cy="152" r="7" fill="#e9e3d6" stroke="#16304a" stroke-width="2"/>
</svg>
